<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>URL Data Organizer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <section class="workspace-panel" aria-labelledby="app-title">
      <header class="topbar">
        <div>
          <p class="eyebrow">URL INSPECTION DESK</p>
          <h1 id="app-title">URL Data Organizer</h1>
        </div>
        <div class="status-pill" id="status-pill" aria-live="polite">Ready</div>
      </header>

      <div class="input-grid">
        <section class="source-panel" aria-labelledby="source-title">
          <div class="section-heading">
            <span class="heading-mark"></span>
            <div>
              <h2 id="source-title">Source</h2>
              <p>貼上 URL，或在抓取失敗時改貼頁面文字。</p>
            </div>
          </div>

          <label class="field-label" for="source-url">URL</label>
          <div class="url-row">
            <input id="source-url" type="url" placeholder="https://example.com/product-page">
            <button class="icon-button" id="fetch-button" type="button" title="Fetch URL" aria-label="Fetch URL">
              <span aria-hidden="true">↗</span>
            </button>
          </div>

          <label class="field-label" for="source-text">Page text</label>
          <textarea id="source-text" spellcheck="false" placeholder="抓取失敗時，把頁面內容貼在這裡。"></textarea>

          <div class="action-row">
            <button class="primary-button" id="analyze-button" type="button">整理重點</button>
            <button class="ghost-button" id="clear-button" type="button">清空</button>
          </div>
        </section>

        <section class="result-panel" aria-labelledby="result-title">
          <div class="section-heading">
            <span class="heading-mark alt"></span>
            <div>
              <h2 id="result-title">Extracted Data</h2>
              <p>輸出可直接複製到筆記或任務描述。</p>
            </div>
          </div>

          <div class="summary-box">
            <span class="box-label">Summary</span>
            <p id="summary-output">等待輸入資料。</p>
          </div>

          <div class="data-grid">
            <article class="data-card">
              <h3>Locations</h3>
              <ul id="locations-output"></ul>
            </article>
            <article class="data-card">
              <h3>Products</h3>
              <ul id="products-output"></ul>
            </article>
            <article class="data-card">
              <h3>Prices</h3>
              <ul id="prices-output"></ul>
            </article>
            <article class="data-card">
              <h3>Uses</h3>
              <ul id="uses-output"></ul>
            </article>
          </div>

          <div class="json-panel">
            <div class="json-header">
              <span>Structured JSON</span>
              <button class="icon-button small" id="copy-button" type="button" title="Copy JSON" aria-label="Copy JSON">
                <span aria-hidden="true">□</span>
              </button>
            </div>
            <pre id="json-output">{}</pre>
          </div>
        </section>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
